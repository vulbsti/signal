[project]
name = "signal-noise-reducer"
version = "0.1.0"
description = "Gemini-powered personal AI agent that filters content, curates social feeds, and counters radicalization"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.2.0",
    "google-genai>=1.14.0",
    "playwright>=1.49.0",
    "python-telegram-bot>=22.0",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "praw>=7.8.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
voice = ["pyaudio>=0.2.14"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
include = ["signal_agent*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
